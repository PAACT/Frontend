<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airline Price Threshold</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Flight watch</p>
          <h1>HYD ⇄ DFW fare monitor</h1>
        </div>
        <div class="actions">
          <button id="runDemo" class="secondary">Run demo</button>
          <button id="runSearch">Run search</button>
        </div>
      </header>

      <div class="layout">
        <aside class="panel settings-panel">
          <h2>Watch settings</h2>

          <form id="configForm">
            <div class="grid two">
              <label>
                <span>Origin</span>
                <input name="origin" />
              </label>
              <label>
                <span>Destination</span>
                <input name="destination" />
              </label>
            </div>

            <div class="grid two">
              <label>
                <span>Adults</span>
                <input name="adults" type="number" min="1" />
              </label>
              <label>
                <span>Currency</span>
                <input name="currency" />
              </label>
            </div>

            <div class="grid two">
              <label>
                <span>Threshold</span>
                <input name="threshold" type="number" step="1" />
              </label>
              <label>
                <span>Re-alert drop</span>
                <input name="realert_drop" type="number" step="1" />
              </label>
            </div>

            <div class="grid two">
              <label>
                <span>Searches/run</span>
                <input name="searches_per_run" type="number" min="0" />
              </label>
              <label>
                <span>Check every (hrs)</span>
                <input name="check_every_hours" type="number" step="0.5" min="1" />
              </label>
            </div>

            <div class="grid two">
              <label>
                <span>Exact stops</span>
                <input name="exact_stops" type="number" min="0" />
              </label>
              <label>
                <span>SerpApi key</span>
                <input name="serpapi_key" type="password" />
              </label>
            </div>

            <div class="subsection">
              <h3>Departure window</h3>
              <div class="grid two">
                <label>
                  <span>From</span>
                  <input name="departure_window_from" type="date" />
                </label>
                <label>
                  <span>To</span>
                  <input name="departure_window_to" type="date" />
                </label>
              </div>
            </div>

            <div class="subsection">
              <h3>Trip length</h3>
              <div class="grid three">
                <label>
                  <span>Min days</span>
                  <input name="trip_length_min_days" type="number" min="1" />
                </label>
                <label>
                  <span>Max days</span>
                  <input name="trip_length_max_days" type="number" min="1" />
                </label>
                <label>
                  <span>Step days</span>
                  <input name="trip_length_step_days" type="number" min="1" />
                </label>
              </div>
            </div>

            <div class="inline-row">
              <label class="checkbox">
                <input name="alerts_macos" type="checkbox" />
                <span>macOS notification</span>
              </label>
            </div>

            <div class="actions form-actions">
              <button type="button" class="secondary" id="resetForm">Reset</button>
              <button type="submit">Save settings</button>
            </div>
          </form>
        </aside>

        <main class="main-panel">
          <section class="metrics" id="metrics"></section>

          <section class="panel table-panel">
            <div class="panel-header">
              <h2>Latest fare options</h2>
            </div>
            <div id="historyTable" class="history-table"></div>
          </section>

          <section class="panel log-panel">
            <div class="panel-header">
              <h2>Run log</h2>
            </div>
            <pre id="runLog">Waiting for a check…</pre>
          </section>
        </main>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
